[package]
name = "temporule-cli"
description = "Temporule（拾律）命令行工具"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "temporule"
path = "src/main.rs"

[dependencies]
